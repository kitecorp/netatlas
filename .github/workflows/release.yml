name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The whole history, so the tag can be checked against master. The token stays out of the git
      # config: the job pushes images and charts with it, never commits.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only code that passed Required on master is published; a tag on any other commit stops here.
      - name: The tagged commit is on master
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$TAG is not on master, so it is not released"
            exit 1
          fi

      # The image tag, the chart version and its appVersion all come from the git tag, so a tag that
      # disagrees with any of them would publish one version under another's name.
      - name: The tag matches package.json and Chart.yaml
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          a=$(node -p "require('./package.json').version")
          b=$(sed -n 's/^version:[[:space:]]*//p' charts/netatlas/Chart.yaml | tr -d "\"'")
          c=$(sed -n 's/^appVersion:[[:space:]]*//p' charts/netatlas/Chart.yaml | tr -d "\"'")
          v=${TAG#v}
          if [ "$v" != "$a" ] || [ "$v" != "$b" ] || [ "$v" != "$c" ]; then
            echo "::error::tag $TAG does not match package.json $a, Chart.yaml version $b and appVersion $c"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A published version never changes: a tag pushed again would replace what people pinned.
      - name: The version is not published yet
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release-unpublished.sh "ghcr.io/kitecorp/netatlas:$VERSION"
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kitecorp/netatlas:${{ steps.version.outputs.version }}

      - uses: azure/setup-helm@v5.1.0
        with:
          version: v4.3.1
      - name: Push the chart
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package charts/netatlas --destination dist
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "dist/netatlas-$VERSION.tgz" oci://ghcr.io/kitecorp/charts

  # The GitHub Release for the tag, with notes GitHub writes from the merged pull requests. A job of its own,
  # so that a failure here cannot stop the image and the chart, which the job above has already published.
  github-release:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # --verify-tag refuses a tag that is not on GitHub, rather than creating one from the default branch.
      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes
