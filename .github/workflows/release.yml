name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The whole history, so the tag can be checked against master. The token stays out of the git
      # config: the job pushes images and charts with it, never commits.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only code that passed Required on master is published; a tag on any other commit stops here.
      - name: The tagged commit is on master
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$TAG is not on master, so it is not released"
            exit 1
          fi

      # The image tag and the chart file the push step expects come from the git tag; helm package
      # takes the chart's version from Chart.yaml, and the chart's annotations name the image and the
      # pictures. A tag that disagrees with Chart.yaml stops the release half way, after the image is
      # pushed, and one that disagrees with the annotations lists another version's image or pictures.
      # CI runs the same check without a tag, so a place left behind is found before the tag is pushed.
      - name: The tag matches every place that names the version
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(scripts/release-versions.sh "$TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A published version never changes: a tag pushed again would replace what people pinned.
      - name: The version is not published yet
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release-unpublished.sh "ghcr.io/kitecorp/netatlas:$VERSION"
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kitecorp/netatlas:${{ steps.version.outputs.version }}

      - uses: azure/setup-helm@v5.1.0
        with:
          version: v4.3.1
      - name: Push the chart
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package charts/netatlas --destination dist
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "dist/netatlas-$VERSION.tgz" oci://ghcr.io/kitecorp/charts

  # The GitHub Release for the tag, with notes GitHub writes from the merged pull requests. A job of its own,
  # so that a failure here cannot stop the image and the chart, which the job above has already published.
  github-release:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # --verify-tag refuses a tag that is not on GitHub, rather than creating one from the default branch.
      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes

  # The repository's metadata for Artifact Hub, pushed beside the chart under the tag artifacthub.io, where Artifact Hub
  # reads it (https://artifacthub.io/docs/topics/repositories/helm-charts/). A job of its own, so that a failure here
  # cannot stop the image and the chart, which the job above has already published.
  artifacthub-metadata:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      # The tag's commit, as the release job reads it. The token stays out of the git config: the job pushes a
      # file with it, never commits.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Without the file there is nothing to push, and oras would name only a path it cannot open; this says
      # which file is missing and why it matters.
      - name: The metadata file is in the repository
        shell: bash
        run: |
          if [ ! -f artifacthub-repo.yml ]; then
            echo "::error::artifacthub-repo.yml is not in the repository root, so there is no metadata to push for Artifact Hub"
            exit 1
          fi
      - uses: oras-project/setup-oras@v2.0.4
        with:
          version: 1.4.0
      - name: Push the metadata
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | oras login ghcr.io --username "$ACTOR" --password-stdin
          oras push ghcr.io/kitecorp/charts/netatlas:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
