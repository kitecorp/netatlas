{{- if .Values.ingress.enabled }}
{{- /* The notes and the TLS block name the host, so an ingress without one would render them for no address. */ -}}
{{- if not .Values.ingress.host }}
{{- fail "ingress.enabled needs ingress.host, the address people open netatlas on" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "netatlas.name" . }}
  labels:
    {{- include "netatlas.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.secretName }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "netatlas.name" . }}
                port:
                  name: http
{{- end }}
