# The example shop's workloads (src/model/fixtures/shop.ts), without kube-system's coredns, which kind
# already runs. Each pod runs the pause image: netatlas reads the pods' labels, service accounts and
# declared ports, so nothing needs to listen. Each workload runs as its own ServiceAccount, the
# identity its Istio principal names.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: ingress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ingress
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      serviceAccountName: gateway
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          ports:
            - { name: https, containerPort: 443, protocol: TCP }
