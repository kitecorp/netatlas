# Two people for the Apply journeys in atlas-a's shop namespace: one whose token may write
# NetworkPolicies and one whose token may only read them. The journeys take their tokens with
# `kubectl create token`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: policy-writer
  namespace: shop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: policy-writer
  namespace: shop
rules:
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: policy-writer
  namespace: shop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: policy-writer
subjects:
  - kind: ServiceAccount
    name: policy-writer
    namespace: shop
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: policy-reader
  namespace: shop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: policy-reader
  namespace: shop
rules:
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: policy-reader
  namespace: shop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: policy-reader
subjects:
  - kind: ServiceAccount
    name: policy-reader
    namespace: shop
